<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FCFCFD" />
    <meta name="description" content="Bring chat, mail, meetings, docs, tasks, calendar, and Ukin agents into one connected workspace. Move work from signal to decision, action, and outcome." />
    
    <!-- Google Fonts: DM Serif Display (Display Type), Inter (Body), JetBrains Mono with font-display: swap -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    
    <title>Ultrakin — One workspace for fast teams</title>
    <link rel="canonical" href="https://ultrakin-enterprise.vercel.app/" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- OpenGraph Metadata (Slack / LinkedIn / Discord / Facebook) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ultrakin-enterprise.vercel.app/" />
    <meta property="og:site_name" content="Ultrakin Enterprise" />
    <meta property="og:title" content="Ultrakin — One workspace for fast teams" />
    <meta property="og:description" content="Bring chat, mail, meetings, docs, tasks, calendar, and Ukin agents into one connected workspace. Move work from signal to decision, action, and outcome." />
    <meta property="og:image" content="https://ultrakin-enterprise.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ultrakin Enterprise Workspace — Conversations, Docs, Tasks & Autonomous Agents" />

    <!-- Twitter Card Metadata (X / Twitter) -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ultrakin" />
    <meta name="twitter:creator" content="@ultrakin" />
    <meta name="twitter:title" content="Ultrakin — One workspace for fast teams" />
    <meta name="twitter:description" content="Bring chat, mail, meetings, docs, tasks, calendar, and Ukin agents into one connected workspace. Move work from signal to decision, action, and outcome." />
    <meta name="twitter:image" content="https://ultrakin-enterprise.vercel.app/og-image.png" />
    <meta name="twitter:image:alt" content="Ultrakin Enterprise Workspace" />

    <!-- Schema.org JSON-LD Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Ultrakin",
        "operatingSystem": "Web",
        "applicationCategory": "BusinessApplication, CommunicationApplication",
        "description": "Chat, mail, meetings, docs, tasks, calendar, and Ukin agents in one connected workspace for teams.",
        "url": "https://ultrakin-enterprise.vercel.app",
        "publisher": {
          "@type": "Organization",
          "name": "Ultrakin Technologies, Inc.",
          "url": "https://ultrakin-enterprise.vercel.app",
          "logo": "https://ultrakin-enterprise.vercel.app/logo.svg"
        }
      }
    </script>
  </head>
  <body class="bg-page text-ink antialiased selection:bg-brand/20 selection:text-ink overflow-x-hidden min-h-screen">
    <div id="root">
      <!-- ── Zero-JS Instant Branded Splash (Eliminates initial blank white screen) ── -->
      <div
        id="ultrakin-pre-loader"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #FCFCFD;
          z-index: 99999;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          pointer-events: none;
        "
        aria-hidden="true"
      >
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <div
            style="
              position: absolute;
              width: 72px;
              height: 72px;
              border-radius: 50%;
              background: radial-gradient(circle, rgba(49,86,207,0.18) 0%, rgba(99,102,241,0.06) 60%, transparent 80%);
              filter: blur(8px);
              animation: uk-pulse 1.8s ease-in-out infinite;
            "
          ></div>
          <svg width="48" height="48" viewBox="0 0 44 44" fill="none" style="position: relative; z-index: 1;">
            <rect width="44" height="44" rx="11" fill="#3156CF"/>
            <path d="M14 15V22C14 26.4183 17.5817 30 22 30C26.4183 30 30 26.4183 30 22V15" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div
          style="
            margin-top: 18px;
            height: 2.5px;
            width: 76px;
            background: rgba(49,86,207,0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
          "
        >
          <div
            style="
              position: absolute;
              inset: 0;
              width: 50%;
              background: linear-gradient(90deg, transparent, #3156CF, transparent);
              animation: uk-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            "
          ></div>
        </div>
      </div>
      <style>
        @keyframes uk-pulse {
          0%, 100% { opacity: 0.35; transform: scale(0.92); }
          50% { opacity: 0.85; transform: scale(1.18); }
        }
        @keyframes uk-slide {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
